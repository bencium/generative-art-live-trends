<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Echoes - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Neural Echoes</h1>
            <div class="subtitle">Wave interference patterns and memory-carrying particles exploring the rippling resonance of thought</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Wave Sources</label>
                    <div class="slider-container">
                        <input type="range" id="waveSourceCount" min="3" max="12" step="1" value="6" oninput="updateParam('waveSourceCount', this.value)">
                        <span class="value-display" id="waveSourceCount-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Base Frequency</label>
                    <div class="slider-container">
                        <input type="range" id="baseFrequency" min="0.5" max="3.0" step="0.1" value="1.2" oninput="updateParam('baseFrequency', this.value)">
                        <span class="value-display" id="baseFrequency-value">1.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="3000" step="100" value="1500" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1500</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Interference Strength</label>
                    <div class="slider-container">
                        <input type="range" id="interferenceStrength" min="0.2" max="2.0" step="0.1" value="1.0" oninput="updateParam('interferenceStrength', this.value)">
                        <span class="value-display" id="interferenceStrength-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Fade Rate</label>
                    <div class="slider-container">
                        <input type="range" id="trailFade" min="0.001" max="0.02" step="0.001" value="0.008" oninput="updateParam('trailFade', this.value)">
                        <span class="value-display" id="trailFade-value">0.008</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Particle Responsiveness</label>
                    <div class="slider-container">
                        <input type="range" id="particleResponsiveness" min="0.01" max="0.2" step="0.01" value="0.08" oninput="updateParam('particleResponsiveness', this.value)">
                        <span class="value-display" id="particleResponsiveness-value">0.08</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing neural echoes...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // NEURAL ECHOES - GENERATIVE ART PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            waveSourceCount: 6,
            baseFrequency: 1.2,
            particleCount: 1500,
            interferenceStrength: 1.0,
            trailFade: 0.008,
            particleResponsiveness: 0.08
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // NEURAL ECHOES ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let particles = [];
        let waveSources = [];
        let time = 0;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');

            initializeSystem();

            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            particles = [];
            waveSources = [];
            time = 0;

            // Create wave sources with harmonic frequency relationships
            for (let i = 0; i < params.waveSourceCount; i++) {
                let angle = (i / params.waveSourceCount) * TWO_PI;
                let radius = width * 0.3;
                let x = width / 2 + cos(angle) * radius;
                let y = height / 2 + sin(angle) * radius;

                // Harmonic ratios: 1, 1.5, 2, 2.5, 3, etc. (based on musical intervals)
                let frequencyRatio = 1 + (i * 0.5);
                let frequency = params.baseFrequency * frequencyRatio;

                waveSources.push({
                    x: x,
                    y: y,
                    frequency: frequency,
                    phase: random(TWO_PI),
                    amplitude: random(0.7, 1.0)
                });
            }

            // Create particles
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }

            // Dark background for phosphorescent trails
            background(8, 8, 12);
        }

        function draw() {
            // Subtle fade for trail effect
            fill(8, 8, 12, params.trailFade * 100);
            noStroke();
            rect(0, 0, width, height);

            time += 0.016; // ~60fps equivalent

            // Update and draw particles
            for (let particle of particles) {
                particle.update();
                particle.display();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PARTICLE CLASS - Memory carriers following wave gradients
        // ═══════════════════════════════════════════════════════════════════════

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = 2.5;
                this.maxForce = 0.3;
                this.prevPos = this.pos.copy();
            }

            update() {
                this.prevPos = this.pos.copy();

                // Calculate wave field at current position
                let waveValue = this.calculateWaveField(this.pos.x, this.pos.y);

                // Calculate gradient (direction of steepest ascent)
                let gradient = this.calculateGradient(this.pos.x, this.pos.y);

                // Apply force toward constructive interference
                let force = gradient.mult(params.particleResponsiveness);
                force.mult(params.interferenceStrength);
                this.applyForce(force);

                // Update physics
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                // Wrap around edges
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.y < 0) this.pos.y = height;
                if (this.pos.y > height) this.pos.y = 0;
            }

            calculateWaveField(x, y) {
                let totalWave = 0;

                for (let source of waveSources) {
                    let distance = dist(x, y, source.x, source.y);
                    let wave = sin(distance * 0.02 - time * source.frequency + source.phase);
                    totalWave += wave * source.amplitude;
                }

                return totalWave / waveSources.length;
            }

            calculateGradient(x, y) {
                let delta = 5; // Small step for gradient calculation

                let centerValue = this.calculateWaveField(x, y);
                let rightValue = this.calculateWaveField(x + delta, y);
                let leftValue = this.calculateWaveField(x - delta, y);
                let upValue = this.calculateWaveField(x, y - delta);
                let downValue = this.calculateWaveField(x, y + delta);

                let dx = (rightValue - leftValue) / (2 * delta);
                let dy = (downValue - upValue) / (2 * delta);

                return createVector(dx, dy);
            }

            applyForce(force) {
                this.acc.add(force);
            }

            display() {
                let waveValue = this.calculateWaveField(this.pos.x, this.pos.y);

                // Map wave value to color
                // Hue: based on dominant frequency contribution
                let dominantFreq = this.getDominantFrequency();
                let hue = map(dominantFreq, params.baseFrequency, params.baseFrequency * 6, 180, 300); // Cyan to violet

                // Saturation: based on wave amplitude
                let sat = map(abs(waveValue), 0, 1, 60, 100);

                // Brightness: based on constructive interference
                let bright = map(waveValue, -1, 1, 50, 100);

                // Alpha: constant for better visibility
                let alpha = 0.8;

                colorMode(HSB, 360, 100, 100, 1);
                stroke(hue, sat, bright, alpha);
                strokeWeight(2.5);

                // Draw trail line
                line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
            }

            getDominantFrequency() {
                let maxContribution = 0;
                let dominantFreq = params.baseFrequency;

                for (let source of waveSources) {
                    let distance = dist(this.pos.x, this.pos.y, source.x, source.y);
                    let contribution = abs(sin(distance * 0.02 - time * source.frequency + source.phase)) * source.amplitude;

                    if (contribution > maxContribution) {
                        maxContribution = contribution;
                        dominantFreq = source.frequency;
                    }
                }

                return dominantFreq;
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;

            // Reinitialize if structural parameters change
            if (paramName === 'waveSourceCount' || paramName === 'particleCount' || paramName === 'baseFrequency') {
                initializeSystem();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};

            // Update all UI elements
            document.getElementById('waveSourceCount').value = params.waveSourceCount;
            document.getElementById('waveSourceCount-value').textContent = params.waveSourceCount;
            document.getElementById('baseFrequency').value = params.baseFrequency;
            document.getElementById('baseFrequency-value').textContent = params.baseFrequency;
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('interferenceStrength').value = params.interferenceStrength;
            document.getElementById('interferenceStrength-value').textContent = params.interferenceStrength;
            document.getElementById('trailFade').value = params.trailFade;
            document.getElementById('trailFade-value').textContent = params.trailFade;
            document.getElementById('particleResponsiveness').value = params.particleResponsiveness;
            document.getElementById('particleResponsiveness-value').textContent = params.particleResponsiveness;

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>

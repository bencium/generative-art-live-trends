[build]
  # Build WASM module before deploying
  command = "curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh && cd trends-wasm && wasm-pack build --target web"

  # Publish directory
  publish = "."

  # Functions directory
  functions = "netlify/functions"

# Auto-install function dependencies
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Redirect rules
[[redirects]]
  from = "/api/trends"
  to = "/.netlify/functions/trends"
  status = 200

# Default index page
[[redirects]]
  from = "/"
  to = "/search_currents_wasm.html"
  status = 200

# SPA fallback (if needed)
[[redirects]]
  from = "/*"
  to = "/search_currents_wasm.html"
  status = 404

# Headers for CORS and caching
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/trends-wasm/pkg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
